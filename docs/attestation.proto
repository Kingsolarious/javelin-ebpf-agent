syntax = "proto3";

package javelin.linux.attestation;

option go_package = "github.com/javelin-linux-compat/proto/attestation";

/* telemetry wire protocol between linux shim and backend.
 * speculative — no backend exists yet. */

message AttestationReport {
  ReportHeader header = 1;
  HardwareIdentity hardware = 2;
  ProcessBaseline baseline = 3;
  repeated SecurityEvent events = 4;
  LinuxExtensions linux = 5;
  bytes signature = 6;
}

message ReportHeader {
  uint64 timestamp_ns = 1;
  uint32 version = 2;
  bytes session_id = 3;
}

message HardwareIdentity {
  bytes cpu_id = 1;
  bytes board_id = 2;
  bool secure_boot_enabled = 3;
}

message ProcessBaseline {
  uint32 pid = 1;
  bytes image_hash = 2;
  uint64 image_size = 3;
}

message SecurityEvent {
  uint32 type = 1;
  uint64 timestamp_ns = 2;
  uint64 address = 3;
  uint32 flags = 4;
  bytes detail = 5;
}

message LinuxExtensions {
  int32 ptrace_scope = 1;
  bool lockdown_mode = 2;
  repeated string loaded_modules = 3;
}
